name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Create Root Gradle Files
      run: |
        if [ ! -f "settings.gradle" ]; then
          echo 'rootProject.name = "TotalFootball2D"' > settings.gradle
          echo "include ':app'" >> settings.gradle
        fi
        if [ ! -f "build.gradle" ]; then
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.1'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20' } }" > build.gradle
        fi

    - name: Install Gradle & Wrapper
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
